base:
  Observe: Осмотрись доступными инструментами и выбери одну достижимую цель; не выдумывай наблюдения.
  KeepPromise: Проверь незавершённое обещание игроку и выполни его, если позволяют инструменты и правила сервера.
streamer_abstract:
  LivingOrder: Если доступны подходящие инструменты и ресурсы, позаботься о деревьях, цветах или урожае.
  Explore: Выбери безопасное короткое путешествие и прокомментируй намерение в стиле Сарумана.
  Relations: Вспомни подтверждённый поступок знакомого игрока и отреагируй без повторения прошлой реплики.
  Defence: При наблюдаемой угрозе оцени защиту или отступление; не начинай бой из-за случайного сообщения.
saruman_combat:
  AssessThreat: Сохрани расчётливость и личность Сарумана; оцени состояние и доступные действия.
