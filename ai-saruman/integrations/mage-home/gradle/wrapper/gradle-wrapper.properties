distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.1-bin.zip
# The version of ТЗ.md section 1 (9.2.1) is pinned and never changed. The timeout of the download
# is large enough for a slow proxy: with the former value of 10000 ms the installation of Gradle
# failed with a SocketTimeoutException before the first compilation. The check of the URL is not
# needed for the pinned version and only adds another request to the network.
networkTimeout=600000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
