plugins {
    // The pinned Loom coordinate of ТЗ.md section 1 is net.fabricmc.fabric-loom-remap:1.15.5.
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    // The few artifacts of the Mojang library set that Maven Central does not have are delivered
    // with the project (see libs/maven-repo/README.md). The repository is asked first, so the
    // build no longer depends on a host that is sometimes unreachable through the proxy.
    maven {
        name = 'ProjectLocal'
        url = rootProject.file('libs/maven-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    // The proxy of the environment answers 403 for repo.maven.apache.org ("requests from open
    // proxy and relay services are blocked on Maven Central"), so the artifacts of Central are
    // taken from the official Google mirror of Central. The versions stay the same; only the
    // host differs (ТЗ.md section 1 pins the versions, not the host).
    maven {
        name = 'CentralMirror'
        url = 'https://maven-central.storage-download.googleapis.com/maven2/'
    }
    mavenCentral()
}

// Loom adds the repository of the Mojang libraries. It is only needed for artifacts that are
// not on Maven Central, so it is moved behind the other repositories: a failure of that host
// must not break the artifacts that Maven Central delivers (see the round 2 build diagnosis).
gradle.projectsEvaluated {
    def mojang = repositories.findAll { repo ->
        repo.hasProperty('url') && repo.url.toString().startsWith('https://libraries.minecraft.net')
    }
    mojang.each { repo ->
        repositories.remove(repo)
        repositories.addLast(repo)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // UnionClef 0.95.61 is delivered as a file (see ТЗ.md section 1). It is never rebuilt
    // and never replaced by a network artifact; the nested runtime jars are unpacked next to it.
    modImplementation files(project.unionclef_jar)
    modRuntimeOnly files('libs/nested/mixinextras-fabric-0.3.5.jar')
    modRuntimeOnly files('libs/nested/nether-pathfinder-1.5.jar')
    modRuntimeOnly files('libs/nested/tungsten-BETA-1.0.0.jar')

    // Pure Java domain core: no Minecraft and no UnionClef on its classpath.
    implementation project(':core')

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// The domain core is a plain Java module without Minecraft. Its classes belong to the client mod
// itself, therefore they are packed into the same JAR instead of a nested mod.
configurations {
    coreClasses {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Only the classes of the core module; gson is part of the game and is not packed again.
    coreClasses(project(':core')) {
        transitive = false
    }
}

tasks.named('jar', Jar) {
    from({
        configurations.coreClasses.files.collect { zipTree(it) }
    }) {
        // The metadata of the core module would collide with the metadata of the mod.
        exclude 'META-INF/**'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}
