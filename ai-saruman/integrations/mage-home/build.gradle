plugins {
    // The pinned Loom coordinate of ТЗ.md section 1 is net.fabricmc.fabric-loom-remap:1.15.5.
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    // The few artifacts of the Mojang library set that Maven Central does not have are delivered
    // with the project (see libs/maven-repo/README.md). The repository is asked first, so the
    // build no longer depends on a host that is sometimes unreachable through the proxy.
    maven {
        name = 'ProjectLocal'
        url = rootProject.file('libs/maven-repo')
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    // The proxy of the environment answers 403 for repo.maven.apache.org ("requests from open
    // proxy and relay services are blocked on Maven Central"), so the artifacts of Central are
    // taken from the official Google mirror of Central. The versions stay the same; only the
    // host differs (ТЗ.md section 1 pins the versions, not the host).
    maven {
        name = 'CentralMirror'
        url = 'https://maven-central.storage-download.googleapis.com/maven2/'
    }
    mavenCentral()
}

// Loom adds the repository of the Mojang libraries. It is only needed for artifacts that are
// not on Maven Central, so it is moved behind the other repositories: a failure of that host
// must not break the artifacts that Maven Central delivers (see the round 2 build diagnosis).
gradle.projectsEvaluated {
    def mojang = repositories.findAll { repo ->
        repo.hasProperty('url') && repo.url.toString().startsWith('https://libraries.minecraft.net')
    }
    mojang.each { repo ->
        repositories.remove(repo)
        repositories.addLast(repo)
    }
}

// Acceptance scenario id is only meaningful for gameplay runs (see docs/ACCEPTANCE.md).
def acceptanceScenario = providers.gradleProperty('labAcceptanceScenario').getOrElse('')

// The directory of the JUnit report of a gameplay scenario. The independent runner reads the
// fresh reports of the build directory, so the report of the running game has to be written
// there as well.
def acceptanceResultsDir = layout.buildDirectory.dir('test-results/acceptance').get().asFile.absolutePath

loom {
    runs {
        client {
            client()
            vmArg "-Dlab.acceptance.scenario=${acceptanceScenario}"
            vmArg "-Dlab.acceptance.results.dir=${acceptanceResultsDir}"
        }
        persistenceSeed {
            client()
            runDir 'run'
            vmArg '-Dlab.acceptance.scenario=persistence-after-exit'
            vmArg '-Dlab.acceptance.fixture.phase=seed'
            vmArg "-Dlab.acceptance.results.dir=${acceptanceResultsDir}"
        }
        persistenceReload {
            client()
            runDir 'run'
            vmArg '-Dlab.acceptance.scenario=persistence-after-exit'
            vmArg '-Dlab.acceptance.fixture.phase=reload'
            vmArg "-Dlab.acceptance.results.dir=${acceptanceResultsDir}"
        }
    }
}

tasks.named('runPersistenceReload') {
    dependsOn 'runPersistenceSeed'
}

tasks.register('runPersistenceCheck') {
    group = 'verification'
    description = 'Seeds a partial house, exits Minecraft, then verifies restart in a second client JVM'
    dependsOn 'runPersistenceReload'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // UnionClef 0.95.61 is delivered as a file (see ТЗ.md section 1). It is never rebuilt
    // and never replaced by a network artifact; the nested runtime jars are unpacked next to it.
    modImplementation files(project.unionclef_jar)
    modRuntimeOnly files('libs/nested/mixinextras-fabric-0.3.5.jar')
    modRuntimeOnly files('libs/nested/nether-pathfinder-1.5.jar')
    modRuntimeOnly files('libs/nested/tungsten-BETA-1.0.0.jar')

    // Pure Java domain core: no Minecraft and no UnionClef on its classpath.
    implementation project(':core')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// The domain core is a plain Java module without Minecraft. Its classes belong to the client mod
// itself, therefore they are packed into the same JAR instead of a nested mod.
configurations {
    coreClasses {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Only the classes of the core module; gson is part of the game and is not packed again.
    coreClasses(project(':core')) {
        transitive = false
    }
}

tasks.named('jar', Jar) {
    from({
        configurations.coreClasses.files.collect { zipTree(it) }
    }) {
        // The metadata of the core module would collide with the metadata of the mod.
        exclude 'META-INF/**'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// The named checks of the core belong to the build of the project: the build stage of the
// independent runner has to produce their fresh JUnit report as well.
tasks.named('check') {
    dependsOn ':core:test'
}

def clientArtifact = tasks.named('remapJar')
project(':core').tasks.withType(Test).configureEach { dependsOn clientArtifact }

// The executable check inventory of the domain core. The names of these tasks are the ones the
// scenario manifest uses; a unit run selects the task without the client only property.
tasks.register('coreTest') {
    group = 'verification'
    description = 'Runs the named domain checks of the core module as JUnit cases'
    dependsOn ':core:test'
}

// Isolated lab only: launch the remapped shipping JAR with an original Minecraft client.
if (providers.gradleProperty('mageStevePackaged').isPresent()) {
    def env = System.getenv()
    def endpoint = env['MAGE_STEVE_ENDPOINT'] ?: ''
    def gameDirectory = new File(env['MAGE_STEVE_GAME'] ?: '')
    def save = env['MAGE_STEVE_LOCAL_SAVE'] ?: ''
    if (!gameDirectory.isAbsolute() || !gameDirectory.isDirectory() ||
            (save ? (!(save ==~ /lab-[a-z]+/) || !new File(gameDirectory, "saves/${save}/level.dat").isFile())
                  : !(endpoint ==~ /127\.0\.0\.1:[0-9]{1,5}/))) {
        throw new GradleException('Packaged Steve requires a private lab save or loopback endpoint')
    }
    def rawFabricApi = configurations.detachedConfiguration(dependencies.create(
        "net.fabricmc.fabric-api:fabric-api:${fabric_version}"))
    rawFabricApi.transitive = false
    tasks.register('runStevePackaged', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        group = 'verification'
        description = 'Runs the remapped Mage Home JAR on the isolated dedicated-server fixture'
        dependsOn tasks.named('remapJar')
        mods.from(tasks.named('remapJar'), file(project.unionclef_jar), rawFabricApi)
        runDir.set(gameDirectory)
        useXVFB.set(false) // the stand already owns and supervises Xvfb
        programArgs.addAll('--username', 'Steve', '--uuid',
            UUID.nameUUIDFromBytes('OfflinePlayer:Steve'.getBytes('UTF-8')).toString(),
            '--accessToken', '0', '--version', project.minecraft_version)
        jvmArgs.add('-XX:ActiveProcessorCount=4')
        if (save) {
            jvmArgs.add('-Dmage_home.control.enable=true')
            if (env['MAGE_STEVE_JOIN_FROM_LAB'] != '1') {
                mods.from(file('/opt/lab/fixtures/minecraft-client/runtime/dependency-bootstrap.jar'))
                jvmArgs.addAll('-Dlab.client.setup.adapter=altoclef-title-1.21.11-0.95.61',
                    '-Dlab.client.setup.world=' + save,
                    '-Dlab.client.setup.output=' + new File(gameDirectory, 'client-dependency-preparation.json').absolutePath)
            }
        } else {
            jvmArgs.add('-Dmage_home.lab.steveServer=' + endpoint)
        }
        if (env['MAGE_STEVE_ENGINE']) {
            jvmArgs.add('-Dmage_home.lab.engine=' + env['MAGE_STEVE_ENGINE'])
        }
        [MAGE_STEVE_PYTHON: 'mage_home.model.python',
         MAGE_STEVE_MODULE_PATH: 'mage_home.model.modulePath',
         MAGE_STEVE_DESIGN_PROFILE: 'mage_home.model.designProfile',
         MAGE_STEVE_EXPERT_PROFILE: 'mage_home.model.expertProfile',
         MAGE_STEVE_PREP_DELAY: 'mage_home.lab.preparationDelayTicks'].each { key, property ->
            def value = env[key]
            if (value != null && !value.isBlank()) jvmArgs.add('-D' + property + '=' + value)
        }
    }
}

tasks.register('coreCheck') {
    group = 'verification'
    description = 'Runs the named domain checks and writes the report into core/build/reports/mage_home'
    dependsOn ':core:coreCheck'
}
