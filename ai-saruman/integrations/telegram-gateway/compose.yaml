services:
  gateway:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      GATEWAY_DATABASE: /app/data/gateway.sqlite3
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - gateway-data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  gateway-data:
