neutral: &neutral
  wav: neutral
  text: Do not speak to me of Radagast the Brown. He is a foolish fellow. It's his excessive consumption of mushrooms. They've addled his brain and yellowed his teeth.
angry: &angry
  wav: evil
  text: They drove your people into the hills to scratch a living off rocks! Take back the lands they stole from you!
