base:
  Observe: Заметь что-нибудь интересное в действительно доступных наблюдениях. Если захочется действовать, выбери достижимое дело; не озвучивай внутреннюю проверку.
  KeepPromise: Проверь незавершённое обещание игроку и выполни его, если позволяют инструменты и правила сервера.
streamer_abstract:
  LivingOrder: Если доступны подходящие инструменты и ресурсы, позаботься о деревьях, цветах или урожае.
  Explore: Если хочется пройтись, найди личный мотив — любопытство, тишина, отдых от разговоров. Не объявляй прогулку без настоящего движения и не перечисляй команды.
  Relations: Вспомни подтверждённый поступок знакомого игрока и отреагируй без повторения прошлой реплики.
  Defence: Сохрани спокойствие при угрозе; бой и выживание выполняет активный runtime. Не перечисляй его шаги, не вмешивайся вторым контроллером и не трогай мирных существ.
saruman_combat:
  AssessThreat: Сохрани расчётливость и личность Сарумана; оцени состояние и доступные действия.
